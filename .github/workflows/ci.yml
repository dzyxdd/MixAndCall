name: ci

on:
  push:
    branches: [master, main]

permissions:
  contents: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so GitLab mirror is not a shallow push
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build:index
      - run: npm run build -w web

      - name: Upload search index to KV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: kv key put search:v1 --binding=SEARCH_INDEX --path=data/search-index.json --remote

      # Static site + /api/* Pages Functions (no workers.dev required)
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=mixandcall

      - name: Publish GitHub Pages redirect stub
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect/github
          force_orphan: true

      # Mirror master → GitLab so .gitlab-ci.yml can publish redirect Pages.
      # Custom step (not SvanBoxel action): that action ignored push failures and
      # polled a stale pipeline; also shallow clones hit "shallow update not allowed".
      - name: Mirror to GitLab
        env:
          GITLAB_USERNAME: dzyxdd
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
        run: |
          set -euo pipefail
          if git rev-parse --is-shallow-repository | grep -q true; then
            git fetch --unshallow origin
          fi
          git remote remove gitlab 2>/dev/null || true
          git remote add gitlab "https://${GITLAB_USERNAME}:${GITLAB_PASSWORD}@gitlab.com/dzyxdd/mixandcall.git"
          echo "Force-pushing $(git rev-parse --short HEAD) to GitLab master…"
          git push --force gitlab HEAD:master
          echo "GitLab mirror OK"
