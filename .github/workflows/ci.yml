name: ci

on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build:index
      - run: npm run build -w web

      - name: Upload search index to KV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: kv key put search:v1 --binding=SEARCH_INDEX --path=data/search-index.json --remote

      # Static site + /api/* Pages Functions (no workers.dev required)
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=mixandcall

      - name: Publish GitHub Pages redirect stub
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./redirect/github
          force_orphan: true

      # Mirror master → GitLab so .gitlab-ci.yml can publish redirect Pages
      - name: Mirror to GitLab
        uses: SvanBoxel/gitlab-mirror-and-ci-action@master
        with:
          args: 'https://gitlab.com/dzyxdd/mixandcall'
        env:
          FOLLOW_TAGS: 'false'
          FORCE_PUSH: 'true'
          GITLAB_HOSTNAME: 'gitlab.com'
          GITLAB_USERNAME: 'dzyxdd'
          GITLAB_PASSWORD: ${{ secrets.GITLAB_PASSWORD }}
          GITLAB_PROJECT_ID: '55129156'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
